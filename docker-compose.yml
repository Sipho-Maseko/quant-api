version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: quant_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: quant_backtest_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quant_backtest_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: quant_fastapi_app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:secretpassword@db:5432/quant_backtest_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: